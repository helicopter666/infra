[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (безопасность)
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "ANN101",   # self не аннотируем
    "ANN102",   # cls не аннотируем
    "S101",     # assert допустим в тестах
    "B008",     # Depends() в сигнатурах FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]  # в тестах не требуем аннотации и игнорируем безопасность

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit тесты без IO",
    "integration: Интеграционные тесты с БД/Redis",
    "slow: Медленные тесты (LLM-вызовы с реальным API)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
