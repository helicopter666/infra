[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps", "config", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP",
    "N", "SIM", "TCH", "ANN", "S", "PTH",
    "DJ",   # flake8-django — Django-специфичные правила
]
ignore = [
    "ANN101", "ANN102",
    "S101",
    "DJ001",  # null=True на CharField — иногда нужно
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"*/migrations/*" = ["ALL"]   # миграции не линтируем

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
known-third-party = ["django", "rest_framework"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit тесты",
    "integration: Интеграционные тесты с БД",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
